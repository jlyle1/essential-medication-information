# ╭─────────────────────────Commonly Used ImplementationGuide Properties───────────────────────────╮
# │  The properties below are used to create the ImplementationGuide resource. The most commonly   │
# │  used properties are included. For a list of all supported properties and their functions,     │
# │  see: https://fshschool.org/docs/sushi/configuration/.                                         │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
id: va-emi
canonical: http://va.gov/fhir/emi
name: EssentialMedicationInformation
title: VA Essential Medication Information
description: Implementation Guide for Essential Medication Information based on VHA Directive 1164
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1 # https://www.hl7.org/fhir/valueset-FHIR-version.html
copyrightYear: 2024+
releaseLabel: ci-build
license: CC0-1.0 # https://www.hl7.org/fhir/valueset-spdx-license.html
jurisdiction: urn:iso:std:iso:3166#US "United States of America"
publisher:
  name: VA Pharmacy Benefits Management Services
  url: https://www.va.gov/

# Dependencies
dependencies:
  hl7.terminology.r4: 6.0.2

# Pages
pages:
  index.md:
    title: Home
  usecase.md:
    title: Use Cases
  fetching-medication-information.md:
    title: Fetching Medication Information
  artifacts.html:
    title: Artifacts
  downloads.md:
    title: Downloads

# Menu
menu:
  Home: index.html
  Use Cases: usecase.html
  Fetching Medications: fetching-medication-information.html
  Artifacts: artifacts.html
  Operation: OperationDefinition-essential-medication-information-for-review.html
  Downloads: downloads.html

# Parameters
parameters:
  show-inherited-invariants: false
  path-expansion-params: '../../exp-params.json'  #path is relative to [base]/fsh-generated/resources

# Instance options
instanceOptions:
  manualSliceOrdering: true
  setMetaProfile: always
  setId: always

# Groups for organized artifact display
groups:
  PatientProfiles:
    name: Patient and Demographics
    description: Profiles for patient identification
    resources:
      - StructureDefinition/emi-patient
  AllergyProfiles:
    name: Allergy/ADR
    description: Profiles for allergies and adverse drug reactions
    resources:
      - StructureDefinition/emi-allergyintolerance
  MedicationProfiles:
    name: Medications
    description: Profiles for medication information from various sources (inheritance hierarchy)
    resources:
      - StructureDefinition/emi-all-medications
      - StructureDefinition/emi-all-but-documented-medications
      - StructureDefinition/emi-prescriptions
      - StructureDefinition/emi-finished-prescriptions
      - StructureDefinition/emi-documented-medications
  DispenseProfiles:
    name: Dispense and Pharmacy
    description: Profiles for dispense events and pharmacy information
    resources:
      - StructureDefinition/emi-medicationdispense
      - StructureDefinition/emi-pharmacy-organization
  ProviderProfiles:
    name: Provider
    description: Profiles for healthcare providers
    resources:
      - StructureDefinition/emi-practitioner
  BundleProfiles:
    name: Bundle and Parameters
    description: Profiles for operation input/output
    resources:
      - StructureDefinition/emi-medication-bundle
      - StructureDefinition/emi-request-parameters
  Operations:
    name: Operations
    description: FHIR Operations defined by this IG
    resources:
      - OperationDefinition/essential-medication-information-for-review
  SearchParameters:
    name: Search Parameters
    description: Custom search parameters defined by this IG
    resources:
      - SearchParameter/active-end
  Terminology:
    name: Terminology
    description: Code systems and value sets
    resources:
      - CodeSystem/emi-medication-source
      - ValueSet/emi-medication-source-vs
  Identifiers:
    name: Identifier Systems
    description: NamingSystem resources defining identifier systems used in this IG
    resources:
      - NamingSystem/icn-naming-system
      - NamingSystem/edipi-naming-system
      - NamingSystem/vista-patient-ien-naming-system
      - NamingSystem/vista-rx-number-naming-system
      - NamingSystem/vista-unit-dose-order-naming-system
      - NamingSystem/vista-iv-order-naming-system
